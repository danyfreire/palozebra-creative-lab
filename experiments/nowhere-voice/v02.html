ect(adtD.delayTime);adtO.start();slapD=ac.createDelay(.25);slapG=ac.createGain();slapFb=ac.createGain();comp.connect(slapD);slapD.connect(slapFb).connect(slapD);slapD.connect(slapG).connect(wet);rotAmp=ac.createGain();pan=ac.createStereoPanner();rotG=ac.createGain();comp.connect(rotAmp).connect(pan).connect(rotG).connect(wet);rotO=ac.createOscillator();rotDepth=ac.createGain();rotO.connect(rotDepth).connect(rotAmp.gain);rotO.start();panO=ac.createOscillator();panDepth=ac.createGain();panO.connect(panDepth).connect(pan.pan);panO.start();conv=ac.createConvolver();conv.buffer=impulse();rev=ac.createGain();comp.connect(conv).connect(rev).connect(wet);wet.connect(master);dsp(+time.value);draw()}function r(p,v,s=.05){let n=ac.currentTime;p.cancelScheduledValues(n);p.setValueAtTime(p.value,n);p.linearRampToValueAtTime(v,n+s)}function dsp(x){if(!ac)return;let e=bell(x,.08,.17),p=bell(x,.32,.13),a=bell(x,.57,.12),s=bell(x,.80,.11),m=bell(x,.97,.09);r(hp.frequency,85+p*45);r(lp.frequency,7200+m*5000+a*800);r(peak.frequency,2200+p*650+s*250);r(peak.gain,1+p*5.4+a*2);r(comp.threshold,-17-e*4-s*5);comp.ratio.value=3.2+e*1.5+s*1.8;r(adtG.gain,bypass?0:C(e*.25+p*.92+m*.72+a*.18)*.64);r(adtD.delayTime,.021+p*.006+m*.006);r(adtMod.gain,.0015+p*.0085+e*.002);adtO.frequency.value=.38+p*.32;r(slapG.gain,bypass?0:s*.7);r(slapD.delayTime,.082+s*.014);r(slapFb.gain,.1+s*.25);r(rotG.gain,bypass?0:a*.72);rotO.frequency.value=4.1+a*1.8;r(rotDepth.gain,.04+a*.24);panO.frequency.value=2.4;r(panDepth.gain,.1+a*.58);r(rev.gain,bypass?0:C(e*.1+p*.5+a*.58+s*.22+m*.38));r(dry.gain,bypass?1:C(.88-p*.18-a*.2-s*.05));r(wet.gain,bypass?0:1);r(master.gain,.86)}function stop(){if(src){try{src.stop()}catch{}src.disconnect();src=null}playing=false;play.textContent='▶ Loop'}function loop(){if(!buf)return;ensure();ac.resume();stop();src=ac.createBufferSource();src.buffer=buf;src.loop=true;src.connect(hp);src.start();playing=true;play.textContent='■ Detener';status.textContent='LOOP ACTIVO · MUEVE TIME'}play. g.lineTo(x,y):g.moveTo(x,y)}}else{g.moveTo(0,r.height/2);g.lineTo(r.width,r.height/2)}g.stroke()};f()}addEventListener('resize',size);size();visual(+time.value);draw()})();</script></body></html>
