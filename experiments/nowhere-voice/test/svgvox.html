    const smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a));return t*t*(3-2*t)};

    function eraWeights(x){
      const w=[0,0,0,0,0];
      if(x<=0){w[0]=1;return w}
      if(x>=1){w[4]=1;return w}
      for(let i=0;i<4;i++){
        if(x>=ERAS[i].x&&x<=ERAS[i+1].x){
          const t=smooth(ERAS[i].x,ERAS[i+1].x,x);
          w[i]=1-t;w[i+1]=t;break;
        }
      }
      return w;
    }

    function updateLabels(x){
      const w=eraWeights(x);
      if(yearEl)yearEl.textContent=Math.round(w.reduce((s,v,i)=>s+v*ERAS[i].year,0));
      const idx=w.indexOf(Math.max(...w));
      if(nameEl)nameEl.textContent=ERAS[idx].name;
      if(techEl)techEl.textContent=ERAS[idx].tech;
    }

    function updateGlasses(x){
      glassEls.forEach((el,i)=>{
        const dist=Math.abs(x-glassStops[i]);
        const w=Math.exp(-Math.pow(dist/.115,2));
        el.style.opacity=(w*.92).toFixed(3);
      });

      const psy=bell(x,.31,.13),rot=bell(x,.57,.12),solo=bell(x,.79,.11),modern=bell(x,.97,.08);
      const ga=scene.querySelector('.glow-a'),gb=scene.querySelector('.glow-b'),gc=scene.querySelector('.glow-c');
      ga.style.opacity=(.32+psy*.17+rot*.05).toFixed(2);
      gb.style.opacity=(.27+rot*.08+modern*.13).toFixed(2);
      gc.style.opacity=(.09+rot*.16+solo*.09).toFixed(2);
      ga.style.transform=`translate3d(${(-4+psy*7)}vw,${(-2+rot*3)}vh,0) scale(${.96+psy*.1})`;
      gb.style.transform=`translate3d(${(2-psy*4-modern*2)}vw,${(2-rot*3)}vh,0) scale(${.97+rot*.09})`;
      gc.style.transform=`translate3d(0,${(x-.5)*8}vh,0) rotate(${-4+rot*7-solo*2}deg)`;
    }

    function setKnobVisual(x){
      const angle=-135+x*270;
      rotor.style.transform=`translate(-50%,-50%) rotate(${angle}deg)`;
    }

    let value=parseFloat(slider.value||'.38');
    let raf=0,lastDSP=0,dspTimer=0;

    function sendDSP(){
      dspTimer=0;
      lastDSP=performance.now();
      slider.dispatchEvent(new Event('input',{bubbles:true}));
    }

    function setValue(v,{fromUI=true}={}){
      value=clamp(v);
      slider.value=value.toFixed(4);
      setKnobVisual(value);
      updateLabels(value);
      updateGlasses(value);
      if(fromUI){
        const now=performance.now();
        const wait=Math.max(0,40-(now-lastDSP));
        if(!dspTimer)dspTimer=setTimeout(sendDSP,wait);
      }
    }

    function queueValue(v){
      if(raf)cancelAnimationFrame(raf);
      raf=requestAnimationFrame(()=>{raf=0;setValue(v)});
    }

    function pointerToValue(clientX,clientY){
      const r=knob.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      let angle=Math.atan2(clientY-cy,clientX-cx)*180/Math.PI+90;
      if(angle>180)angle-=360;
      angle=clamp(angle,-135,135);
      return (angle+135)/270;
    }

    let dragging=false;
    knobWrap.addEventListener('pointerdown',e=>{
      dragging=true;
      knobWrap.setPointerCapture?.(e.pointerId);
      queueValue(pointerToValue(e.clientX,e.clientY));
      e.preventDefault();
    });
    knobWrap.addEventListener('pointermove',e=>{
      if(!dragging)return;
      queueValue(pointerToValue(e.clientX,e.clientY));
    });
    const end=e=>{
      dragging=false;
      knobWrap.releasePointerCapture?.(e.pointerId);
    };
    knobWrap.addEventListener('pointerup',end);
    knobWrap.addEventListener('pointercancel',end);

    setValue(value,{fromUI:false});
    sendDSP();
  }catch(err){
    console.error('Nowhere Voice SVG glasses/VOX knob test',err);
  }
});
</script>
</body>
</html>
