<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowhere Voice — Palozebra Creative Lab</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}iframe{border:0;width:100%;height:100%;display:block;background:#080808}</style></head><body><iframe id="app" src="./v02.html?visual=final2" allow="microphone; autoplay"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{try{
 const d=f.contentDocument;if(!d)return;
 const stage=d.querySelector('.stage');if(!stage)return;
 const lang=(()=>{const l=(navigator.language||'en').toLowerCase();return l.startsWith('es')?'es':l.startsWith('it')?'it':'en'})();
 const copy={
  es:{hint:'ARRASTRA PARA CAMBIAR LA ÉPOCA',rec:'● Grabar',stopRec:'■ Detener',loop:'▶ Loop',stop:'■ Detener',original:'Original',reset:'Reset',start:'GRABA UNA FRASE DE 5–10 SEGUNDOS',recording:'GRABANDO…',active:'LOOP ACTIVO · MUEVE TIME',orig:'ORIGINAL',proc:'NOWHERE PROCESSING',mic:'NO SE PUDO ACCEDER AL MICRÓFONO',back:'Volver al Creative Lab'},
  en:{hint:'DRAG TO CHANGE THE ERA',rec:'● Record',stopRec:'■ Stop',loop:'▶ Loop',stop:'■ Stop',original:'Original',reset:'Reset',start:'RECORD A 5–10 SECOND PHRASE',recording:'RECORDING…',active:'LOOP ACTIVE · MOVE TIME',orig:'ORIGINAL',proc:'NOWHERE PROCESSING',mic:'MICROPHONE ACCESS FAILED',back:'Back to Creative Lab'},
  it:{hint:'TRASCINA PER CAMBIARE EPOCA',rec:'● Registra',stopRec:'■ Stop',loop:'▶ Loop',stop:'■ Stop',original:'Originale',reset:'Reset',start:'REGISTRA UNA FRASE DI 5–10 SECONDI',recording:'REGISTRAZIONE…',active:'LOOP ATTIVO · MUOVI TIME',orig:'ORIGINALE',proc:'NOWHERE PROCESSING',mic:'ACCESSO AL MICROFONO NON RIUSCITO',back:'Torna al Creative Lab'}
 }[lang];
 d.documentElement.lang=lang;
 const style=d.createElement('style');style.textContent=`
 .back{display:none!important}
 .era{transition:none!important}
 .ghost{transition:none!important}
 .v4-atmos{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;mix-blend-mode:screen;contain:strict}
 .v4-orb,.v4-ring,.v4-beam,.v4-slices{position:absolute;will-change:transform,opacity;transition:none!important;backface-visibility:hidden;transform-style:preserve-3d}
 .v4-orb{border-radius:50%;filter:blur(38px)}
 .v4-a{width:72vw;height:72vw;left:-20vw;top:-18vw;background:radial-gradient(circle,rgba(255,239,206,.34),rgba(255,143,77,.10) 34%,transparent 68%)}
 .v4-b{width:66vw;height:66vw;right:-22vw;bottom:-20vw;background:radial-gradient(circle,rgba(90,184,255,.30),rgba(168,67,255,.09) 34%,transparent 70%)}
 .v4-ring{left:50%;top:46%;width:46vmin;height:46vmin;border:1px solid rgba(255,255,255,.16);border-radius:50%;box-shadow:0 0 0 7vmin rgba(255,255,255,.028),0 0 0 15vmin rgba(255,255,255,.018)}
 .v4-beam{left:-10%;width:120%;height:10vh;top:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03) 30%,rgba(255,238,200,.17) 50%,rgba(255,255,255,.03) 70%,transparent)}
 .v4-slices{inset:0;background:repeating-linear-gradient(90deg,transparent 0 10vw,rgba(255,255,255,.032) 10.15vw 10.3vw,transparent 10.45vw 16vw)}
 .v4-back{position:absolute;right:18px;top:16px;z-index:30;width:34px;height:34px;border:1px solid rgba(255,255,255,.22);border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;background:rgba(0,0,0,.28);font:18px/1 Arial,sans-serif}
 .v4-back:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.42)}
 @media(max-width:700px){.v4-a{width:112vw;height:112vw;left:-44vw;top:-25vw}.v4-b{width:108vw;height:108vw;right:-44vw;bottom:-28vw}.v4-ring{width:60vmin;height:60vmin}.v4-back{right:12px;top:12px}}
 `;d.head.appendChild(style);
 const atmos=d.createElement('div');atmos.className='v4-atmos';atmos.innerHTML='<div class="v4-orb v4-a"></div><div class="v4-orb v4-b"></div><div class="v4-ring"></div><div class="v4-beam"></div><div class="v4-slices"></div>';stage.insertBefore(atmos,stage.querySelector('.vignette'));
 const back=d.createElement('a');back.className='v4-back';back.href='../../';back.setAttribute('aria-label',copy.back);back.title=copy.back;back.textContent='←';stage.appendChild(back);
 const name=d.getElementById('eraName')||d.getElementById('name');const rename=()=>{if(!name)return;if(name.textContent==='EARLY BEATLES')name.textContent='EARLY MONO';if(name.textContent==='DOUBLE FANTASY')name.textContent='DUAL FANTASTIC'};rename();if(name)new MutationObserver(rename).observe(name,{childList:true,subtree:true,characterData:true});
 const hint=d.querySelector('.hint');if(hint)hint.textContent=copy.hint;
 const record=d.getElementById('record'),play=d.getElementById('play'),original=d.getElementById('original'),reset=d.getElementById('reset'),status=d.getElementById('status');
 if(original)original.textContent=copy.original;if(reset)reset.textContent=copy.reset;
 const translateText=(el)=>{if(!el)return;const t=el.textContent.trim();const map={
  '● Grabar':copy.rec,'■ Detener':el===record?copy.stopRec:copy.stop,'▶ Loop':copy.loop,
  'GRABA UNA FRASE DE 5–10 SEGUNDOS':copy.start,'GRABANDO…':copy.recording,'LOOP ACTIVO · MUEVE TIME':copy.active,
  'ORIGINAL':copy.orig,'NOWHERE PROCESSING':copy.proc,'NO SE PUDO ACCEDER AL MICRÓFONO':copy.mic
 };if(map[t])el.textContent=map[t]};
 [record,play,status].forEach(el=>{translateText(el);if(el)new MutationObserver(()=>translateText(el)).observe(el,{childList:true,subtree:true,characterData:true})});
 const slider=d.getElementById('time'),a=d.querySelector('.v4-a'),b=d.querySelector('.v4-b'),ring=d.querySelector('.v4-ring'),beam=d.querySelector('.v4-beam'),slices=d.querySelector('.v4-slices');
 const bell=(x,c,w)=>Math.exp(-.5*((x-c)/w)**2);let raf=0;
 function paint(){raf=0;const x=+slider.value,early=bell(x,.06,.16),psy=bell(x,.31,.13),rot=bell(x,.57,.12),solo=bell(x,.79,.11),modern=bell(x,.97,.08);
  a.style.opacity=.04+early*.13+psy*.30+rot*.10+solo*.05;a.style.transform=`translate3d(${(-6+psy*18+rot*6)}vw,${(-3+rot*8)}vh,0) scale(${.92+psy*.22})`;
  b.style.opacity=.03+psy*.25+rot*.14+modern*.22;b.style.transform=`translate3d(${(5-psy*13-modern*4)}vw,${(4-rot*7)}vh,0) scale(${.90+rot*.22+modern*.08})`;
  ring.style.opacity=.015+psy*.20+rot*.34+modern*.05;ring.style.transform=`translate3d(-50%,-50%,0) rotate(${x*120}deg) scale(${.76+rot*.48+psy*.16})`;
  beam.style.opacity=.01+rot*.28+solo*.16;beam.style.transform=`translate3d(0,${(x-.5)*16}vh,0) rotate(${-7+rot*12-solo*4}deg)`;
  slices.style.opacity=.012+early*.08+psy*.14+modern*.12;slices.style.transform=`translate3d(${(x-.5)*10}vw,0,0) skewX(${-4+psy*10-modern*3}deg)`;
 }
 const queuePaint=()=>{if(!raf)raf=requestAnimationFrame(paint)};slider.addEventListener('input',queuePaint,{passive:true});paint();
}catch(e){console.error('Nowhere Voice visual layer',e)}});
</script></body></html>
