<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowhere Voice — Palozebra Creative Lab</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}iframe{border:0;width:100%;height:100%;display:block;background:#080808}</style></head><body><iframe id="app" src="./v02.html?visual=final" allow="microphone; autoplay"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;const stage=d.querySelector('.stage');if(!stage)return;const style=d.createElement('style');style.textContent=`.v4-atmos{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;mix-blend-mode:screen}.v4-orb,.v4-ring,.v4-beam,.v4-slices{position:absolute;will-change:transform,opacity;transition:opacity .14s linear,transform .14s linear,filter .14s linear}.v4-orb{border-radius:50%;filter:blur(52px)}.v4-a{width:74vw;height:74vw;left:-20vw;top:-18vw;background:radial-gradient(circle,rgba(255,239,206,.38),rgba(255,143,77,.12) 34%,transparent 68%)}.v4-b{width:68vw;height:68vw;right:-22vw;bottom:-20vw;background:radial-gradient(circle,rgba(90,184,255,.34),rgba(168,67,255,.11) 34%,transparent 70%)}.v4-ring{left:50%;top:46%;width:48vmin;height:48vmin;border:1px solid rgba(255,255,255,.18);border-radius:50%;box-shadow:0 0 0 8vmin rgba(255,255,255,.032),0 0 0 17vmin rgba(255,255,255,.022)}.v4-beam{left:-15%;width:130%;height:12vh;top:39%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.035) 30%,rgba(255,238,200,.20) 50%,rgba(255,255,255,.035) 70%,transparent);filter:blur(16px)}.v4-slices{inset:0;background:repeating-linear-gradient(90deg,transparent 0 9vw,rgba(255,255,255,.038) 9.15vw 9.35vw,transparent 9.5vw 15vw)}.v4-back{position:absolute;left:16px;bottom:16px;z-index:30;width:34px;height:34px;border:1px solid rgba(255,255,255,.22);border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;background:rgba(0,0,0,.18);backdrop-filter:blur(8px);font:18px/1 Arial,sans-serif}.v4-back:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.42)}@media(max-width:700px){.v4-a{width:118vw;height:118vw;left:-48vw;top:-28vw}.v4-b{width:112vw;height:112vw;right:-48vw;bottom:-30vw}.v4-ring{width:62vmin;height:62vmin}.v4-back{left:12px;bottom:12px}}`;d.head.appendChild(style);const atmos=d.createElement('div');atmos.className='v4-atmos';atmos.innerHTML='<div class="v4-orb v4-a"></div><div class="v4-orb v4-b"></div><div class="v4-ring"></div><div class="v4-beam"></div><div class="v4-slices"></div>';stage.insertBefore(atmos,stage.querySelector('.vignette'));const back=d.createElement('a');back.className='v4-back';back.href='../../';back.setAttribute('aria-label','Volver al Creative Lab');back.textContent='←';stage.appendChild(back);const name=d.getElementById('eraName')||d.getElementById('name');const rename=()=>{if(!name)return;if(name.textContent==='EARLY BEATLES')name.textContent='EARLY MONO';if(name.textContent==='DOUBLE FANTASY')name.textContent='DUAL FANTASTIC'};rename();if(name)new MutationObserver(rename).observe(name,{childList:true,subtree:true,characterData:true});const slider=d.getElementById('time'),a=d.querySelector('.v4-a'),b=d.querySelector('.v4-b'),ring=d.querySelector('.v4-ring'),beam=d.querySelector('.v4-beam'),slices=d.querySelector('.v4-slices');const bell=(x,c,w)=>Math.exp(-.5*((x-c)/w)**2);function paint(){const x=+slider.value,early=bell(x,.06,.16),psy=bell(x,.31,.13),rot=bell(x,.57,.12),solo=bell(x,.79,.11),modern=bell(x,.97,.08);a.style.opacity=(.04+early*.13+psy*.30+rot*.10+solo*.05).toFixed(2);b.style.opacity=(.03+psy*.25+rot*.14+modern*.22).toFixed(2);a.style.transform=`translate(${(-6+psy*18+rot*6).toFixed(1)}vw,${(-3+rot*8).toFixed(1)}vh) scale(${(.92+psy*.22).toFixed(2)})`;b.style.transform=`translate(${(5-psy*13-modern*4).toFixed(1)}vw,${(4-rot*7).toFixed(1)}vh) scale(${(.90+rot*.22+modern*.08).toFixed(2)})`;ring.style.opacity=(.015+psy*.20+rot*.34+modern*.05).toFixed(2);ring.style.transform=`translate(-50%,-50%) rotate(${(x*120).toFixed(0)}deg) scale(${(.76+rot*.48+psy*.16).toFixed(2)})`;beam.style.opacity=(.01+rot*.28+solo*.16).toFixed(2);beam.style.transform=`translateY(${((x-.5)*16).toFixed(1)}vh) rotate(${(-7+rot*12-solo*4).toFixed(1)}deg)`;slices.style.opacity=(.012+early*.08+psy*.14+modern*.12).toFixed(2);slices.style.transform=`translateX(${((x-.5)*10).toFixed(1)}vw) skewX(${(-4+psy*10-modern*3).toFixed(1)}deg)`}slider.addEventListener('input',paint);paint()}catch(e){console.error('Nowhere Voice visual layer',e)}});</script></body></html>
