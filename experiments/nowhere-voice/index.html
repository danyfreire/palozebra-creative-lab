ame.textContent==='DOUBLE FANTASY')name.textContent='DUAL FANTASTIC'};rename();if(name)new MutationObserver(rename).observe(name,{childList:true,subtree:true,characterData:true});const glasses=[...d.querySelectorAll('.gg')],ga=d.querySelector('.glow-a'),gb=d.querySelector('.glow-b'),dial=d.querySelector('.dial'),pointer=d.querySelector('.pointer'),yearEl=d.getElementById('year');const anchors=[0,.13,.27,.40,.54,.68,.84,1],bell=(x,c,w)=>Math.exp(-.5*((x-c)/w)**2);let target=+slider.value,raf=0,dspTimer=0,lastDSP=0,dragging=false,lastX=0,lastY=0;const eraYear=x=>Math.round(1962+x*18);function paint(){raf=0;const x=target,angle=-135+x*270;pointer.style.transform=`translate(-50%,-48px) rotate(${angle}deg)`;dial.setAttribute('aria-valuenow',eraYear(x));if(yearEl)yearEl.textContent=eraYear(x);const raw=anchors.map(a=>Math.exp(-Math.pow((x-a)/.105,2)));const sum=raw.reduce((s,v)=>s+v,0)||1;glasses.forEach((el,i)=>{const o=raw[i]/sum;el.style.opacity=(o*.72).toFixed(3);el.style.transform=`translate3d(-50%,-50%,0) rotateY(${((x-anchors[i])*85).toFixed(1)}deg) rotateZ(${((i-3.5)*.6).toFixed(1)}deg) scale(${(.92+o*.15).toFixed(3)})`});const psy=bell(x,.31,.13),rot=bell(x,.57,.12),modern=bell(x,.97,.09);ga.style.opacity=.07+psy*.16+rot*.06;ga.style.transform=`translate3d(${(-3+psy*9)}vw,${(-2+rot*5)}vh,0) scale(${.95+psy*.08})`;gb.style.opacity=.05+psy*.12+modern*.13;gb.style.transform=`translate3d(${(3-psy*7)}vw,${(2-rot*4)}vh,0) scale(${.94+modern*.06})`}function queuePaint(){if(!raf)raf=requestAnimationFrame(paint)}function sendDSP(){dspTimer=0;lastDSP=performance.now();slider.value=target.toFixed(3);slider.dispatchEvent(new Event('input',{bubbles:true}))}function queueDSP(){const now=performance.now(),wait=Math.max(0,40-(now-lastDSP));if(!dspTimer)dspTimer=setTimeout(sendDSP,wait)}function setTarget(v){target=Math.max(0,Math.min(1,v));queuePaint();queueDSP()}dial.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;dial.setPointerCapture(e.pointerId);e.preventDefault()});dial.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;setTarget(target+(dx-dy)*.0043);e.preventDefault()});dial.addEventListener('pointerup',e=>{dragging=false;try{dial.releasePointerCapture(e.pointerId)}catch{};sendDSP()});dial.addEventListener('pointercancel',()=>dragging=false);dial.addEventListener('keydown',e=>{const step=e.shiftKey?.05:.012;if(e.key==='ArrowRight'||e.key==='ArrowUp'){setTarget(target+step);e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){setTarget(target-step);e.preventDefault()}});paint()}catch(e){console.error('Nowhere Voice glasses knob test',e)}});</script></body></html>
