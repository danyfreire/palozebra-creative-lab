<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowhere Voice v0.3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}iframe{border:0;width:100%;height:100%;display:block;background:#080808}</style></head><body><iframe id="app" src="./v02.html" allow="microphone; autoplay"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;const stage=d.querySelector('.stage')||d.body;const veil=d.createElement('div');veil.className='v03-veil';const blob1=d.createElement('div');blob1.className='v03-blob v03-a';const blob2=d.createElement('div');blob2.className='v03-blob v03-b';const band=d.createElement('div');band.className='v03-band';const rings=d.createElement('div');rings.className='v03-rings';stage.prepend(veil,blob1,blob2,band,rings);const s=d.createElement('style');s.textContent=`.v03-veil,.v03-blob,.v03-band,.v03-rings{position:absolute;pointer-events:none}.v03-veil{inset:0;z-index:1;mix-blend-mode:screen;opacity:.22;background:radial-gradient(ellipse at 18% 75%,rgba(255,146,91,.18),transparent 34%),radial-gradient(ellipse at 83% 24%,rgba(86,165,255,.16),transparent 36%);transition:opacity .18s linear,filter .18s linear,transform .18s linear}.v03-blob{z-index:1;mix-blend-mode:screen;filter:blur(34px);opacity:.32;transition:all .18s linear}.v03-a{width:72vw;height:70vh;left:-16vw;top:4vh;border-radius:46% 54% 61% 39%/43% 37% 63% 57%;background:radial-gradient(circle at 55% 45%,rgba(255,255,255,.24),rgba(255,194,130,.09) 35%,transparent 68%);animation:v03a 11s ease-in-out infinite alternate}.v03-b{width:64vw;height:64vh;right:-15vw;bottom:-7vh;border-radius:58% 42% 35% 65%/39% 60% 40% 61%;background:radial-gradient(circle at 45% 48%,rgba(111,183,255,.20),rgba(255,83,137,.08) 38%,transparent 70%);animation:v03b 14s ease-in-out infinite alternate}.v03-band{z-index:2;left:-10%;right:-10%;top:45%;height:12vh;opacity:.05;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);filter:blur(14px);transform:rotate(-3deg);transition:all .18s linear}.v03-rings{z-index:1;inset:-12%;opacity:0;background:repeating-radial-gradient(circle at 55% 48%,transparent 0 7vw,rgba(255,255,255,.035) 7.2vw 7.45vw,transparent 7.7vw 10vw);mix-blend-mode:screen;transition:opacity .18s linear,transform .18s linear;animation:v03r 18s linear infinite}@keyframes v03a{to{transform:translate(7vw,3vh) rotate(8deg) scale(1.08)}}@keyframes v03b{to{transform:translate(-6vw,-3vh) rotate(-9deg) scale(1.1)}}@keyframes v03r{to{transform:rotate(360deg)}}@media(max-width:700px){.v03-a{width:105vw;height:70vh;left:-32vw}.v03-b{width:96vw;height:64vh;right:-30vw}.v03-band{height:9vh}}`;d.head.appendChild(s);const name=d.getElementById('name');if(name){const rename=()=>{if(name.textContent==='EARLY BEATLES')name.textContent='EARLY MONO';else if(name.textContent==='DOUBLE FANTASY')name.textContent='DUAL FANTASTIC'};rename();new MutationObserver(rename).observe(name,{childList:true,subtree:true,characterData:true})}const time=d.getElementById('time');function paint(){const x=Number(time?.value||.38),psy=Math.exp(-.5*Math.pow((x-.32)/.13,2)),rot=Math.exp(-.5*Math.pow((x-.57)/.12,2)),solo=Math.exp(-.5*Math.pow((x-.80)/.11,2)),modern=Math.exp(-.5*Math.pow((x-.97)/.09,2));veil.style.opacity=(.10+psy*.28+rot*.15+solo*.08).toFixed(2);veil.style.filter=`blur(${(psy*6+rot*3).toFixed(1)}px) saturate(${(1+psy*.8).toFixed(2)})`;blob1.style.opacity=(.18+psy*.28+rot*.12).toFixed(2);blob2.style.opacity=(.12+psy*.22+modern*.18).toFixed(2);blob1.style.filter=`blur(${(x<.2?24:34)}px) ${x<.2?'grayscale(1)':''} ${solo>.4?'sepia(.5)':''}`;blob2.style.filter=`blur(${(modern>.4?20:34)}px) ${x<.2?'grayscale(1)':''}`;band.style.opacity=(.025+rot*.13+solo*.07).toFixed(2);band.style.transform=`translateY(${((x-.5)*24).toFixed(1)}px) rotate(${(-3+rot*7-solo*3).toFixed(1)}deg)`;rings.style.opacity=(rot*.22+psy*.12).toFixed(2)}paint();time?.addEventListener('input',paint)}catch(e){console.error('Nowhere v0.3 patch',e)}});</script></body></html>
